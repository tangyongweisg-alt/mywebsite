<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose Your Journey</title>
<style>
:root{--bg:#fff4e6;--ink:#2b2140;--box:#e8465b;--box2:#c7283f;--ribbon:#ffd166;--paper:#ffffff;--accent:#5b4bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1530;--ink:#f5efff;--paper:#2c2347;--accent:#9d8cff}}
:root[data-theme="dark"]{--bg:#1b1530;--ink:#f5efff;--paper:#2c2347;--accent:#9d8cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;pointer-events:none;animation:drift 1.4s cubic-bezier(.2,.9,.3,1.2) both,bob 3s ease-in-out 1.4s infinite}
#banner span{display:inline-block;background:var(--accent);color:#fff;padding:12px 28px;font-size:clamp(20px,5vw,30px);font-weight:bold;letter-spacing:.04em;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(-2deg)}
@keyframes drift{from{transform:translateX(-120%)}to{transform:none}}
@keyframes bob{50%{transform:translateY(8px)}}
#main{display:flex;flex-direction:column;align-items:center;margin-top:50px}
#step{margin:0 0 4px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
#stage{position:relative;width:min(320px,90vw);height:410px}
#box{position:absolute;left:50%;top:20px;width:180px;height:170px;margin-left:-90px;cursor:pointer;border:0;background:none;padding:0;animation:idle 2.4s ease-in-out infinite}
#box.shake{animation:shake .7s}
@keyframes idle{50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:none}15%{transform:rotate(-12deg)}30%{transform:rotate(11deg)}45%{transform:rotate(-9deg) translateY(-6px)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.body{position:absolute;bottom:0;left:10px;width:160px;height:120px;background:var(--box);border-radius:0 0 8px 8px}
.body::after{content:"";position:absolute;left:68px;top:0;width:24px;height:100%;background:var(--ribbon)}
.lid{position:absolute;top:0;left:0;width:180px;height:56px;background:var(--box2);border-radius:8px;transition:transform .5s}
.lid::before{content:"";position:absolute;left:78px;top:0;width:24px;height:100%;background:var(--ribbon)}
.lid::after{content:"🎀";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:44px}
#box.open .lid{transform:translate(70px,-30px) rotate(24deg)}
#paper{position:absolute;left:50%;top:50px;width:240px;margin-left:-120px;background:var(--paper);color:var(--ink);padding:16px 14px;text-align:center;border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none}
#paper .e{font-size:50px;line-height:1}
#paper h2{margin:8px 0 4px;font-size:22px}
#paper p{margin:0;font-size:14px;opacity:.8}
#paper.drop{animation:drop 1.1s cubic-bezier(.3,.8,.4,1) forwards}
#paper.back{animation:back .5s ease-in forwards}
@keyframes drop{0%{opacity:0;transform:translateY(0) scale(.3) rotate(0)}30%{opacity:1;transform:translateY(-60px) scale(.8) rotate(-10deg)}100%{opacity:1;transform:translateY(170px) scale(1) rotate(3deg)}}
@keyframes back{from{opacity:1;transform:translateY(170px) rotate(3deg)}to{opacity:0;transform:translateY(0) scale(.3)}}
#hint{min-height:26px;margin:0;font-size:16px;opacity:.85;text-align:center}
#actions,#after{height:64px;display:flex;gap:12px;margin-top:6px;visibility:hidden;align-items:center}
#actions.show,#after.show{visibility:visible}
button.b{font:inherit;font-size:18px;padding:12px 26px;border-radius:999px;border:2px solid var(--accent);cursor:pointer;color:var(--ink);background:transparent}
button.b.yes{background:var(--accent);color:#fff}
#no{position:relative;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#other{font:inherit;font-size:15px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer}
#others{display:flex;gap:10px;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:0;right:0;justify-content:center;flex-wrap:wrap}
#others .o{background:var(--paper);padding:8px 12px;border-radius:6px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:13px;animation:pop .4s both}
#others .o span{font-size:26px;display:block}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
#sike{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);background:var(--ink);color:var(--bg);padding:16px 26px;border-radius:10px;font-size:22px;font-weight:bold;opacity:0;pointer-events:none;transition:.25s;z-index:5;text-align:center;max-width:90vw}
#sike.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#summary{display:none;width:min(360px,90vw);text-align:center}
#summary h1{margin:0 0 14px;font-size:28px}
#summary .row{background:var(--paper);border-radius:8px;padding:12px 14px;margin:10px 0;box-shadow:0 6px 16px rgba(0,0,0,.2);text-align:left;display:flex;gap:12px;align-items:center;animation:pop .5s both}
#summary .row span{font-size:34px}
#summary .row small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
#summary .row b{font-size:17px}
#summary .row i{display:block;font-size:13px;opacity:.75;font-style:normal}
#summary{width:min(380px,92vw)}
#summary h1{font-size:24px;margin:0 0 10px}
#summary .row{padding:7px 12px;margin:6px 0;gap:10px;animation:slidein .6s both}
#summary .row span{font-size:26px}
#summary .row b{font-size:15px}
#summary .row.tbc{border:2px dashed var(--accent);box-shadow:none}
@keyframes slidein{from{opacity:0;transform:translateX(-30px) scale(.95)}}
#intro{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#i1{font-size:clamp(34px,9vw,64px);font-weight:bold;animation:rise .9s .3s both}
#i1 .d{display:inline-block;animation:rise .4s both}
#i2{margin-top:14px;font-size:clamp(22px,6vw,36px);font-style:italic;color:var(--accent);animation:rise .9s 2.4s both}
#i2 .q{display:inline-block;animation:wob 1.2s 3.3s infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes wob{50%{transform:rotate(14deg)}}
body.hold #banner{animation-play-state:paused}
body.hold #main{opacity:0}
#main{transition:opacity .6s}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
</style>
</head>
<body class="hold">
<div id="intro"><div id="i1">A day in JB<span class="d" style="animation-delay:1.2s">.</span><span class="d" style="animation-delay:1.6s">.</span><span class="d" style="animation-delay:2s">.</span></div><div id="i2">what should we do? <span class="q">🤔</span></div></div>
<div id="banner"><span>Choose your journey</span></div>
<div id="main">
  <p id="step"></p>
  <div id="stage">
    <button id="box" aria-label="Shake the box"><div class="lid"></div><div class="body"></div></button>
    <div id="paper"><div class="e" id="pe"></div><h2 id="pt"></h2><p id="pd"></p></div>
  </div>
  <p id="hint"></p>
  <div id="actions"><button class="b yes" id="yes">Accept</button><button class="b" id="no">Reject</button></div>
  <div id="after"><button class="b yes" id="next">Continue</button></div>
  <div id="summary"></div>
</div>
<div id="others"></div>
<div id="sike">sike, dim sum is a must 🥟</div>
<canvas id="c"></canvas>
<script>
const stages=[
 {name:"Breakfast",dodge:3,opts:[{e:"🥟",t:"Ta Si Xi dim sum",l:""}]},
 {name:"Activity",opts:[
  {e:"⛸️",t:"Ice skating",l:"Blue Ice Skating Rink, Paradigm Mall"},
  {e:"🧗",t:"Rock climbing",l:"Camp5 climbing gym, Paradigm Mall"},
  {e:"🏎️",t:"Go karting",l:"Evolt Karting, Aeon Mall Bukit Indah"}]},
 {name:"Massage",opts:[{e:"💆",t:"TangRetreat Spa & Wellness",l:"Taman Pelangi"}]}
];
const $=id=>document.getElementById(id);
const box=$("box"),paper=$("paper"),actions=$("actions"),after=$("after"),hint=$("hint"),no=$("no");
let si=0,cur=null,rejected=[],picks=[],busy=false,state="idle",dodges=0,lastDodge=0;

function intro(){
  $("step").textContent="Step "+(si+1)+" of "+stages.length+" · "+stages[si].name;
  hint.textContent="Tap the box to shake it";
  state="idle";
}
intro();

let introDone=false;
function endIntro(){if(introDone)return;introDone=true;$("intro").classList.add("out");document.body.classList.remove("hold");}
setTimeout(endIntro,5200);$("intro").onclick=endIntro;

function shake(){
  if(busy)return;
  busy=true;state="shaking";
  actions.classList.remove("show");hint.textContent="";
  box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");
  setTimeout(()=>{
    const s=stages[si];
    let pool=s.opts.filter(x=>!rejected.includes(x));
    if(!pool.length){rejected=(cur&&s.opts.length>1)?[cur]:[];pool=s.opts.filter(x=>!rejected.includes(x));}
    const o=cur=pool[Math.floor(Math.random()*pool.length)];
    $("pe").textContent=o.e;$("pt").textContent=o.t;$("pd").textContent=o.l?"📍 "+o.l:"";
    dodges=0;no.style.transform="";
    box.classList.add("open");
    paper.classList.remove("back","drop");void paper.offsetWidth;paper.classList.add("drop");
    burst(innerWidth/2,innerHeight*.4,90);
  },700);
  setTimeout(()=>{
    actions.classList.add("show");
    hint.textContent="Your "+stages[si].name.toLowerCase()+" awaits. Accept it?";
    state="revealed";busy=false;
  },1800);
}
box.addEventListener("click",()=>{if(state==="idle")shake();});

/* reject dodge */
const offs=[[1,-.6],[-1,-.3],[.1,.7]];
function dodge(){
  if(dodges>=3)return false;
  if(Date.now()-lastDodge<300)return true;
  const k=Math.min(130,innerWidth/4),[x,y]=offs[dodges];
  no.style.transform="translate("+x*k+"px,"+y*k+"px)";
  dodges++;lastDodge=Date.now();return true;
}
no.addEventListener("pointerenter",()=>{if(stages[si].dodge)dodge();});
no.addEventListener("pointerdown",e=>{if(stages[si].dodge&&dodges<3){e.preventDefault();dodge();}});
let sikeT;
no.onclick=()=>{
  if(stages[si].dodge){
    if(dodges<3||Date.now()-lastDodge<400){dodge();return;}
    $("sike").classList.add("show");clearTimeout(sikeT);
    sikeT=setTimeout(()=>$("sike").classList.remove("show"),2200);
    return;
  }
  rejected.push(cur);
  actions.classList.remove("show");
  paper.classList.remove("drop");paper.classList.add("back");
  box.classList.remove("open");
  hint.textContent="Not feeling it? Shake the box again";
  state="idle";
};

$("yes").onclick=()=>{
  picks[si]=cur;state="done";
  actions.classList.remove("show");
  const last=si===stages.length-1;
  hint.textContent="Locked in. 🎉";
  $("next").textContent=last?"See my journey":"Next: "+stages[si+1].name;

  after.classList.add("show");
  for(let i=0;i<4;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.3,70),i*250);
};

$("next").onclick=()=>{
  $("others").innerHTML="";after.classList.remove("show");
  si++;
  if(si<stages.length){
    paper.classList.remove("drop");paper.classList.add("back");
    box.classList.remove("open");
    rejected=[];cur=null;intro();
  }else summary();
};

function summary(){
  $("step").textContent="";hint.textContent="";
  $("stage").style.display="none";
  const s=$("summary");
  s.style.display="block";
  const pl=x=>x.l?"📍 "+x.l:"";
  const day=[
   {l:"Breakfast",e:picks[0].e,t:picks[0].t,s:pl(picks[0])},
   {l:"Activity",e:picks[1].e,t:picks[1].t,s:pl(picks[1])},
   {l:"Lunch",e:"🍱",t:"TBC",s:"👀",tbc:1},
   {l:"Massage",e:picks[2].e,t:picks[2].t,s:pl(picks[2])},
   {l:"Treat time",e:"🥐",t:"Bakery / café run",s:""},
   {l:"Dinner",e:"🍽️",t:"TBC",s:"",tbc:1}
  ];
  s.innerHTML="<h1>JB Adventure 🎁</h1>"+day.map((d,i)=>'<div class="row'+(d.tbc?' tbc':'')+'" style="animation-delay:'+i*.9+'s"><span>'+d.e+'</span><div><small>'+d.l+'</small><b></b><i></i></div></div>').join("")+'<button class="b" id="again" style="margin-top:6px;animation:pop .5s both;animation-delay:'+day.length*.9+'s">Start over</button><br><button id="other" style="margin-top:10px;animation:pop .5s both;animation-delay:'+day.length*.9+'s">See what else was in the box</button>';
  s.querySelectorAll(".row").forEach((r,i)=>{r.querySelector("b").textContent=day[i].t;r.querySelector("i").textContent=day[i].s;});
  $("again").onclick=()=>{s.style.display="none";$("others").innerHTML="";$("stage").style.display="";paper.className="";box.classList.remove("open");si=0;picks=[];rejected=[];cur=null;intro();};
  $("other").onclick=()=>{$("other").style.display="none";$("others").innerHTML=stages[1].opts.filter(x=>x!==picks[1]).map(x=>'<div class="o"><span>'+x.e+'</span>'+x.t+'</div>').join("");};
  day.forEach((d,i)=>setTimeout(()=>burst(innerWidth*(.2+Math.random()*.6),innerHeight*.35,25),i*900+300));
  setTimeout(()=>{for(let i=0;i<4;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.3,80),i*250);},day.length*900);
}

/* confetti */
const cv=$("c"),ctx=cv.getContext("2d");let P=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener("resize",size);
const cols=["#ff5d73","#ffd166","#06d6a0","#4cc9f0","#9d8cff","#ff9f1c"];
function burst(x,y,n){
  const was=P.length;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:0});
  }
  if(!was)loop();
}
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.y<innerHeight+20&&p.l<260);
  for(const p of P){
    p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  }
  if(P.length)requestAnimationFrame(loop);
}
</script>
</body>
</html>
